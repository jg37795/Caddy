<!DOCTYPE html>
<!-- =========================================================================
  greenmap.html — 3D Green Slope (integral Caddy app view).
  Launched from the Play tab's "3D Green" pill (greenlink.js) with
  ?lat&lng&teelat&teelng of the current hole's green. Back returns to the app.
  ========================================================================= -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>3D Green — Caddy</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="greenmap.css">
<link rel="stylesheet" href="leaflet.css">
</head>
<body>
<script>
/* Theme parity with the app (v1.2.3): greenmap.html is its own page, so
   nobody was setting body.dark here and the tool always rendered LIGHT
   chrome. Read the same caddy:prefs key the app publishes; 'auto' follows
   the OS. Runs before first paint — no flash. */
(function () {
  try {
    var prefs = JSON.parse(localStorage.getItem('caddy:prefs') || '{}');
    var t = prefs.theme || 'dark';
    var dark = t === 'auto'
      ? !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
      : t === 'dark';
    document.body.className = dark ? 'dark' : '';
  } catch (e) { document.body.className = 'dark'; }
})();
</script>

<div id="gm-stage">
  <canvas id="gm-canvas"></canvas>
</div>

<div id="gm-topbar" class="gm-chrome">
  <button class="gm-btn" id="gm-back" title="Back to the Caddy app" style="display:none">‹ Back</button>
  <span id="gm-title">⛳ 3D Green</span>
  <span id="gm-loc" title="The green this view loaded"></span>
  <span id="gm-status">Loading…</span>
</div>

<!-- v1.2.5: bottom dock — all controls off the top bar so nothing ever
     covers the green. One row, thumb-reachable, segmented groups. -->
<div id="gm-dock" class="gm-chrome">
  <div class="gm-dock-group" role="radiogroup" aria-label="View">
    <button class="gm-btn gm-view-btn active" data-view="2d" title="Top-down 2D map">2D</button>
    <button class="gm-btn gm-view-btn" data-view="3d" title="3D green view">3D</button>
    <button class="gm-btn gm-view-btn" data-view="hole" title="Whole-hole tee→green flyover">Hole</button>
  </div>
  <span id="gm-exag-wrap" style="display:none" title="Vertical exaggeration">
    <label for="gm-exag">Exag</label>
    <input type="range" id="gm-exag" min="1" max="15" step="0.5" value="8">
    <span id="gm-exag-val">8×</span>
  </span>
  <div class="gm-dock-group" role="radiogroup" aria-label="Layers">
    <button class="gm-btn gm-layer-btn active" data-layer="both">Both</button>
    <button class="gm-btn gm-layer-btn" data-layer="shading">Shading</button>
    <button class="gm-btn gm-layer-btn" data-layer="arrows">Arrows</button>
  </div>
  <div class="gm-dock-group" role="radiogroup" aria-label="Colour mode">
    <select id="gm-mode" class="gm-select" title="Color mode">
      <option value="slope">Slope</option>
      <option value="elev">Elev</option>
    </select>
    <select id="gm-stimp" class="gm-select" title="Green speed (Stimpmeter) for the putt preview">
      <option value="8">Stimp 8</option>
      <option value="10" selected>Stimp 10</option>
      <option value="12">Stimp 12</option>
    </select>
  </div>
  <div class="gm-dock-group">
    <button class="gm-btn" id="gm-ball" title="Then tap the green to drop a ball for the putt preview">Ball</button>
    <button class="gm-btn" id="gm-clear-ball">Clear ball</button>
    <button class="gm-btn" id="gm-editloc" title="Verify / adjust which green is loaded">Check location</button>
    <button class="gm-btn" id="gm-recenter">⤢ Fit</button>
  </div>
</div>

<div id="gm-legend" class="gm-chrome">
  <h4 id="gm-legend-title">Slope %</h4>
  <div id="gm-rampbar"></div>
  <div id="gm-ramplabels"><span>0%</span><span>5%</span><span>10%+</span></div>
  <div class="row">↘ arrows point downhill · tap = slope readout</div>
  <div class="row" id="gm-quality" style="opacity:0.65;font-size:10px"></div>
</div>

<div id="gm-tip"></div>

<div id="gm-loading" hidden>
  <div class="gm-load-title">Reading the green…</div>
  <div class="gm-load-bar"></div>
  <div class="gm-load-status" id="gm-load-status">Fetching slope data</div>
</div>

<script src="leaflet.js"></script>
<script src="caddy-elev.js"></script>
<script src="greenmap.js"></script>
<script src="greenedit.js"></script>
</body>
</html>
