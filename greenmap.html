<!DOCTYPE html>
<!-- =========================================================================
  greenmap.html — 3D Green Slope (integral Caddy app view).
  Launched from the Play tab's "3D Green" pill (greenlink.js) with
  ?lat&lng&teelat&teelng of the current hole's green. Back returns to the app.
  ========================================================================= -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>3D Green — Caddy</title>
<script>window.CADDY_VERSION = 'v1.19.0';</script>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="greenmap.css">
<link rel="stylesheet" href="leaflet.css">
</head>
<body>
<!-- v1.4.3: topbar + legend in one flex column wrapper — the legend is a
     layout child, not an overlay, so it can never overlap the bar. -->
<div id="gm-topstack" style="position:fixed; top:0; left:0; right:0; z-index:30; display:flex; flex-direction:column; pointer-events:none; padding-top: var(--safe-top, 0px);">
<div id="gm-topbar" class="gm-chrome" style="pointer-events:auto;">
  <button class="gm-btn" id="gm-back" title="Back to the Caddy app" style="display:none">‹ Back</button>
  <span id="gm-title">⛳ 3D Green</span>
  <span id="gm-loc" title="The green this view loaded"></span>
  <span id="gm-status">Loading…</span>
  <span id="gm-ver" title="App version — if this is old after an update, the service worker is stale: kill the app and reopen" style="color:var(--muted,#9db3a6); font-size:10px; font-weight:700; opacity:0.85; flex:none;"></span>
</div>

<!-- v1.4.3/v1.14.1: legend = seamless second row of the top bar — same
     glass, no own box, no margins; can never cover bar text because it
     IS part of the bar block. -->
<div id="gm-legend" style="pointer-events:auto; position:static; margin:0; width:auto; max-width:none; align-self:stretch; border-radius:0; border:none; border-top:0.5px solid var(--glass-stroke); background:transparent; padding:5px 12px 6px;">
  <div id="gm-legend-inline" style="display:flex; align-items:center; gap:8px; font-size:10.5px; color:var(--muted,#9db3a6); white-space:nowrap; overflow:hidden;">
    <span id="gm-legend-title" style="font-weight:800; letter-spacing:.05em; text-transform:uppercase; font-size:9.5px;">Slope %</span>
    <span id="gm-rampbar" style="flex:1; min-width:70px; height:6px; border-radius:3px; border:0.5px solid var(--glass-stroke);"></span>
    <span id="gm-ramplabels" style="display:flex; gap:5px; font-size:9.5px;"><span>0%</span><span>5%</span><span>10%+</span></span>
    <span class="row" style="margin:0; font-size:10px;">↘ downhill · tap = readout</span>
    <span class="row" id="gm-quality" style="margin:0; font-size:9.5px; opacity:0.7;"></span>
  </div>
</div>
</div>
<script>
/* Theme parity with the app (v1.2.3): greenmap.html is its own page, so
    nobody was setting body.dark here and the tool always rendered LIGHT
    chrome. Read the same caddy:prefs key the app publishes; 'auto' follows
    the OS. Runs before first paint — no flash. */
(function () {
  try {
    var prefs = JSON.parse(localStorage.getItem('caddy:prefs') || '{}');
    var t = prefs.theme || 'dark';
    var dark = t === 'auto'
      ? !(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
      : t === 'dark';
    document.body.className = dark ? 'dark' : '';
  } catch (e) { document.body.className = 'dark'; }
})();
</script>

<div id="gm-stage">
  <canvas id="gm-canvas"></canvas>
</div>

<!-- v1.4.0 dock redesign: 3 contextual rows. Row 1 = view segment (+exag
     in 3D/Hole). Row 2 = data layers (2D gets Shading/Arrows; 3D+ always
     draws both tastefully). Row 3 = actions: ONE ball toggle, Stimp chip
     only while a ball is down, Check location, Fit. -->
<div id="gm-dock" class="gm-chrome">
  <div class="gm-dock-row">
    <div class="gm-dock-group" role="radiogroup" aria-label="View">
      <button class="gm-btn gm-view-btn active" data-view="2d">2D</button>
      <button class="gm-btn gm-view-btn" data-view="3d">3D</button>
      <button class="gm-btn gm-view-btn" data-view="hole">Hole</button>
    </div>
    <span id="gm-exag-wrap" style="display:none" title="Vertical exaggeration">
      <label for="gm-exag">Exag</label>
      <input type="range" id="gm-exag" min="1" max="15" step="0.5" value="8">
      <span id="gm-exag-val">8×</span>
    </span>
  </div>
  <div class="gm-dock-row" id="gm-data-row">
    <div class="gm-dock-group" role="radiogroup" aria-label="Data">
      <button class="gm-btn gm-mode-btn active" data-mode="slope">Slope</button>
      <button class="gm-btn gm-mode-btn" data-mode="elev">Elev</button>
    </div>
    <div class="gm-dock-group" id="gm-layer-group" role="radiogroup" aria-label="Layers">
      <button class="gm-btn gm-layer-btn active" data-layer="both">Both</button>
      <button class="gm-btn gm-layer-btn" data-layer="shading">Shading</button>
      <button class="gm-btn gm-layer-btn" data-layer="arrows">Arrows</button>
    </div>
    <!-- v1.12.0: hole-view texture — Stylized (LiDAR colours, default)
         or Photo (satellite blend). Visible only in hole view. -->
    <div class="gm-dock-group" id="gm-tex-group" role="radiogroup" aria-label="Texture" style="display:none">
      <button class="gm-btn gm-tex-btn active" data-tex="stylized">Stylized</button>
      <button class="gm-btn gm-tex-btn" data-tex="photo">Photo</button>
    </div>
  </div>
  <div class="gm-dock-row">
    <div class="gm-dock-group" id="gm-action-group">
      <button class="gm-btn" id="gm-ball">Drop ball</button>
      <select id="gm-stimp" class="gm-select" title="Green speed (Stimpmeter)" style="display:none">
        <option value="8">Stimp 8</option>
        <option value="10" selected>Stimp 10</option>
        <option value="12">Stimp 12</option>
      </select>
      <button class="gm-btn" id="gm-editloc" title="Verify / adjust which green is loaded">Check location</button>
      <button class="gm-btn" id="gm-recenter">Fit</button>
    </div>
  </div>
</div>

<div id="gm-tip"></div>

<!-- v1.5.0 putt-read card: springs in when a ball is dropped; summarises
     the solver read (break / aim / pace / makeable). Lives outside the
     canvas so it never fights the renderer. -->
<div id="gm-puttcard" class="gm-chrome" hidden>
  <div>
    <div class="gm-pc-label">Play</div>
    <div class="gm-pc-break"><span id="gm-pc-break-val">—</span><span id="gm-pc-break-dir"></span></div>
  </div>
  <div class="gm-pc-row" id="gm-pc-aim">Aim —</div>
  <div class="gm-pc-row"><span class="gm-pc-chip" id="gm-pc-pace">—</span><span id="gm-pc-makeable"></span></div>
</div>

<div id="gm-loading" hidden>
  <div class="gm-load-title">Reading the green…</div>
  <div class="gm-load-bar"></div>
  <div class="gm-load-status" id="gm-load-status">Fetching slope data</div>
</div>

<script src="leaflet.js"></script>
<script src="caddy-elev.js"></script>
<script src="green-detect.js"></script>
<script src="satview.js"></script>
<script src="greenmap.js"></script>
<script src="greenedit.js"></script>
</body>
</html>
